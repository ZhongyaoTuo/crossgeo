name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile all Python files
        run: |
          python -m compileall -q .
          echo "All Python files compiled successfully."
      - name: Verify no hardcoded Windows paths
        run: |
          if grep -rn "E:\\\\megadepth" --include="*.py" .; then
            echo "Found hardcoded local paths!"
            exit 1
          fi
          echo "No hardcoded local paths found."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check --select E9,F63,F7,F82 --statistics . || true